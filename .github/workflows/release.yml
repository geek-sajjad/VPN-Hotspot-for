# Push a tag like v0.1.0 to build the .deb and AppImage and publish them as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/vpn_hotspot/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version in __init__.py"; exit 1; }

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Build AppImage
        run: packaging/build-appimage.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.AppImage --title "VPN Hotspot $GITHUB_REF_NAME" --generate-notes
